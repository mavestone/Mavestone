    <!-- Tailwind CDN for Preview Environment -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
            },
            colors: {
              charcoal: '#0F0F11',
              'soft-black': '#161618',
              'off-white': '#F5F5F7',
              glass: 'rgba(255, 255, 255, 0.05)',
              'glass-border': 'rgba(255, 255, 255, 0.1)',
            },
            backgroundImage: {
              'grain': "url('https://upload.wikimedia.org/wikipedia/commons/7/76/Noise.png')", 
            }
          }
        }
      }
    </script>
    
    <script>
      // MutationObserver to fix Tailwind JIT in preview by forcing scanning of dynamic nodes
      const observer = new MutationObserver((mutations) => {
        // This simple observer keeps the Tailwind CDN alert to DOM changes
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
    </script>
